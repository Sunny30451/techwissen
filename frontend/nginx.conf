server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Accept API requests both before and after a reverse proxy strips APP_BASE_URL.
    location ~ ^(?:${APP_BASE_PATH_REGEX})?/api/ {
        rewrite ^${APP_BASE_PATH_REGEX}(/api/.*)$ $1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve built assets and SPA routes when the public base path reaches Nginx unchanged.
    location ~ ^${APP_BASE_PATH_REGEX}/(.*)$ {
        try_files /$1 /index.html;
    }

    # Also support Dokploy's Strip Path mode and root deployments.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
